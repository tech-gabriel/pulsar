name: Atualizar ocorrências (SEO)

# Redeploy semanal do Render só para regerar os snapshots das páginas de SEO: as
# ocorrências da Defesa Civil (GeoSampa) e as estatísticas do rollup (endpoint
# público /api/estatisticas/regioes). Os dois são gerados no próprio build
# (npm run build), então basta disparar um deploy do master: nada é commitado por
# bot. Se uma fonte estiver fora, o build mantém o JSON anterior dela.
#
# Requer o secret RENDER_DEPLOY_HOOK_URL (Render > serviço pulsar-web > Settings >
# Deploy Hook).

on:
  schedule:
    - cron: '0 10 * * 1'   # segunda, 10:00 UTC (07:00 em Brasília)
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurado."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Deploy disparado."
