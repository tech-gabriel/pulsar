name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

# Cancela execuções antigas do mesmo branch/PR quando há um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Pulsar.slnx

      # Falha o CI quando um pacote (direto ou transitivo) tem vulnerabilidade conhecida.
      - name: Audit
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          dotnet list Pulsar.slnx package --vulnerable --include-transitive | tee audit.txt
          ! grep -q "has the following vulnerable packages" audit.txt

      - name: Build
        run: dotnet build Pulsar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Pulsar.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsar-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pulsar-web/package-lock.json

      - name: Install
        run: npm ci

      # Só dependências que vão para o navegador; alerta de ferramenta de build não trava o PR.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build sem publicar: um Caddyfile ou Dockerfile quebrado aparece no PR, não no deploy.
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false

      - name: Site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false

      - name: Validar Caddyfile
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_DOMAIN=exemplo.test caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

  scripts:
    name: Scripts de deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck deploy/*.sh deploy/testes/*.sh
      - name: Testes
        run: |
          bash deploy/testes/teste-deploy.sh
          bash deploy/testes/teste-backup.sh
