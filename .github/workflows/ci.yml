name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

# Cancela execuções antigas do mesmo branch/PR quando há um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Pulsar.slnx

      # Falha o CI quando um pacote (direto ou transitivo) tem vulnerabilidade conhecida.
      - name: Audit
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          dotnet list Pulsar.slnx package --vulnerable --include-transitive | tee audit.txt
          ! grep -q "has the following vulnerable packages" audit.txt

      - name: Build
        run: dotnet build Pulsar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Pulsar.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsar-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pulsar-web/package-lock.json

      - name: Install
        run: npm ci

      # Só dependências que vão para o navegador; alerta de ferramenta de build não trava o PR.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
