<!doctype html>
<html lang="pt-BR" class="light">
  <head>
    <script src="/theme-init.js"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Viewport mobile: trava o zoom (inputs 16px já evitam zoom no iOS) — ETAPA 6.8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#F8FAFC" />
    <!-- `mobile-web-app-capable` é o nome padrão; o apple- fica pelo iOS antigo. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO + compartilhamento -->
    <title>Pulsar · Monitoramento Climático em Tempo Real</title>
    <meta name="description" content="Monitoramento climático em tempo real para São Paulo. Score de Perigo por subprefeitura, alertas e sugestões de segurança." />
    <link rel="canonical" href="https://app-pulsar.com.br/" />
    <meta property="og:title" content="Pulsar · O mapa vivo da sua segurança" />
    <meta property="og:description" content="Monitoramento climático em tempo real para as 32 subprefeituras de São Paulo." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app-pulsar.com.br/" />
    <!-- 1200x630 (1,91:1) porque é o que Facebook e LinkedIn esperam: o card
         anterior era 1200x360 e saía com barra ou cortado em todo compartilhamento.
         Declarar largura e altura deixa a plataforma montar o card antes de baixar
         a imagem. -->
    <meta property="og:image" content="https://app-pulsar.com.br/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mapa de São Paulo no Pulsar com o risco de cada subprefeitura" />
    <meta property="og:site_name" content="Pulsar" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulsar · O mapa vivo da sua segurança" />
    <meta name="twitter:description" content="Monitoramento climático em tempo real para as 32 subprefeituras de São Paulo." />
    <meta name="twitter:image" content="https://app-pulsar.com.br/og-image.jpg" />
    <!-- Dados estruturados (Schema.org) para o Google entender a marca. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pulsar",
        "url": "https://app-pulsar.com.br/",
        "description": "Monitoramento climático em tempo real para São Paulo, com Score de Perigo por subprefeitura e alertas de risco.",
        "inLanguage": "pt-BR",
        "publisher": {
          "@type": "Organization",
          "name": "Pulsar",
          "url": "https://app-pulsar.com.br/",
          "logo": "https://app-pulsar.com.br/icon-512.png"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
