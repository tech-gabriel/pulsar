<svg class="simbolo-anim" xmlns="http://www.w3.org/2000/svg" viewBox="60 60 392 392"><style>
.simbolo-anim .halo,.simbolo-anim .nucleo,.simbolo-anim .onda{transform-box:view-box;transform-origin:256px 256px}
.simbolo-anim .nucleo{animation:simbolo-nasce .7s cubic-bezier(.34,1.56,.64,1) both,simbolo-acende 4s cubic-bezier(.16,1,.3,1) 2s infinite}
.simbolo-anim .halo{animation:simbolo-floresce 1.2s cubic-bezier(.16,1,.3,1) .25s both}
.simbolo-anim .arcos path{stroke-dasharray:1;animation:simbolo-desenha 1.1s cubic-bezier(.65,0,.35,1) .45s both}
.simbolo-anim .onda{opacity:0;animation:simbolo-pulso 4s cubic-bezier(.16,1,.3,1) 2s infinite}
.simbolo-anim.sem-abertura .nucleo{animation:simbolo-acende 4s cubic-bezier(.16,1,.3,1) 1s infinite}
.simbolo-anim.sem-abertura .halo,.simbolo-anim.sem-abertura .arcos path{animation:none}
.simbolo-anim.sem-abertura .onda{animation-delay:1s}
@keyframes simbolo-nasce{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes simbolo-floresce{0%{transform:scale(0);opacity:0}100%{transform:scale(1)}}
@keyframes simbolo-desenha{0%{stroke-dashoffset:1;opacity:0}12%{opacity:1}100%{stroke-dashoffset:0}}
@keyframes simbolo-pulso{0%{transform:scale(1);opacity:.35}55%,100%{transform:scale(3.6);opacity:0}}
@keyframes simbolo-acende{0%{transform:scale(1.1)}30%,100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.simbolo-anim *{animation:none!important}}
</style><circle class="onda" cx="256" cy="256" r="52" fill="#00A6F4"/><g class="arcos" fill="none" stroke="#00A6F4" stroke-width="46" stroke-linecap="round"><path pathLength="1" d="M242.9 106.6 A150 150 0 0 1 405.4 242.9"/><path pathLength="1" d="M269.1 405.4 A150 150 0 0 1 106.6 269.1"/></g><g class="halo"><circle cx="256" cy="256" r="104" fill="#00A6F4" opacity=".14"/><circle cx="256" cy="256" r="80" fill="#00A6F4" opacity=".26"/></g><circle class="nucleo" cx="256" cy="256" r="52" fill="#00A6F4"/></svg>
